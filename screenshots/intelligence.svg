<text x="310" y="416" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="#14213d">1. AI infrastructure economics are becoming a strategic variable</text><text x="310" y="443" font-family="Arial,sans-serif" font-size="13" fill="#52617a">What changed: New evidence points to meaningful movement in inference cost and capacity.</text><text x="310" y="467" font-family="Arial,sans-serif" font-size="13" fill="#52617a">Why it matters: This could alter the relative advantage of model providers and application builders.</text><text x="310" y="491" font-family="Arial,sans-serif" font-size="13" fill="#52617a">Implication: Revisit assumptions about where durable AI economics may accrue.</text>
<text x="310" y="527" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="#14213d">2. Regulatory implementation is moving from policy to execution</text><text x="310" y="552" font-family="Arial,sans-serif" font-size="13" fill="#52617a">Why it matters: Adoption and product design constraints may diverge materially by market.</text>
<rect x="284" y="584" width="1100" height="203" rx="18" fill="#fff" stroke="#e3e8f0"/><text x="310" y="621" font-family="Arial,sans-serif" font-size="17" font-weight="800" fill="#14213d">Why this is different</text><text x="310" y="650" font-family="Arial,sans-serif" font-size="13" fill="#667085">ORBIT doesn't just collect links. It evaluates new information against your goals,</text><text x="310" y="673" font-family="Arial,sans-serif" font-size="13" fill="#667085">existing intelligence, scratchpad thinking, and current synthesis.</text><rect x="310" y="701" width="300" height="50" rx="12" fill="#edf4ff"/><text x="332" y="732" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#2563eb">New evidence → updated point of view</text>
